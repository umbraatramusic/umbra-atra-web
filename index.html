<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Umbra Atra | Sitio Oficial</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #090909;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
      background:
        linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.95));
    }

    h1 {
      font-size: 5rem;
      letter-spacing: 12px;
      margin-bottom: 20px;
    }

    .subtitle {
      color: #b8b8b8;
      font-size: 1.3rem;
      letter-spacing: 4px;
      margin-bottom: 40px;
    }

    .album {
      color: #b30000;
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .description {
      max-width: 700px;
      color: #d0d0d0;
      line-height: 1.7;
      font-size: 1.1rem;
    }

    .button {
      margin-top: 40px;
      padding: 15px 35px;
      border: 1px solid #b30000;
      color: white;
      text-decoration: none;
      letter-spacing: 2px;
      transition: 0.3s;
    }

    .button:hover {
      background: #b30000;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
      border-top: 1px solid #222;
    }

    @media (max-width: 700px) {
      h1 {
        font-size: 3rem;
        letter-spacing: 6px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>UMBRA ATRA</h1>

    <div class="subtitle">
      SYMPHONIC • GOTHIC • METAL
    </div>

    <div class="album">
      MARIONETA DE SANGRE
    </div>

    <p class="description">
      Bienvenidos al sitio oficial de Umbra Atra.
      Un universo donde la oscuridad, la música sinfónica
      y el metal se unen para contar historias.
    </p>

    <a href="#musica" class="button">
      DESCUBRIR LA MÚSICA
    </a>
  </header>

  <footer>
    © 2026 Umbra Atra — Sitio Oficial
  </footer>

</body>
</html>
